services:
  frontend:
    image: nginx:alpine
    networks:
      macvlan:
        ipv4_address: 10.0.0.44
      internal:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/dist:/usr/share/nginx/html
      - ./ssl/medtrack.crt:/etc/nginx/ssl/cert.pem
      - ./ssl/medtrack.key:/etc/nginx/ssl/key.pem
    depends_on:
      - backend

  backend:
    build: ./api
    networks:
      - internal
      - default
    platform: linux/amd64
    volumes:
      - ./data:/data
    environment:
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - DATABASE_URL=sqlite:/data/medications.db
    restart: unless-stopped

networks:
  macvlan:
    external: true
    name: docker_macvlan
  internal:
    internal: true
